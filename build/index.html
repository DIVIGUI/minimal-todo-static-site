<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的极简待办事项</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      padding: 24px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 16px;
      text-align: center;
      color: var(--text-main);
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .input-group input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: var(--primary-color);
    }

    .input-group button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .input-group button:hover {
      background-color: var(--primary-hover);
    }

    ul {
      list-style: none;
      max-height: 320px;
      overflow-y: auto;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
      transition: background-color 0.2s;
    }

    li:last-child {
      border-bottom: none;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .task-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .task-text {
      font-size: 0.95rem;
      word-break: break-all;
    }

    .completed .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .delete-btn:hover {
      background-color: #fee2e2;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      margin: 24px 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>📝 我的待办事项</h1>
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="输入新的待办任务..." />
      <button onclick="addTask()">添加</button>
    </div>
    <ul id="taskList"></ul>
    <div id="emptyState" class="empty-state">暂无待办事项，快来添加一个吧！</div>
  </div>

  <script>
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');
    const emptyState = document.getElementById('emptyState');

    document.addEventListener('DOMContentLoaded', loadTasks);

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;

      const taskItem = {
        id: Date.now(),
        text: text,
        completed: false
      };

      saveAndRenderTask(taskItem);
      taskInput.value = '';
    }

    taskInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') addTask();
    });

    function getTasks() {
      return JSON.parse(localStorage.getItem('my_tasks') || '[]');
    }

    function saveTasks(tasks) {
      localStorage.setItem('my_tasks', JSON.stringify(tasks));
      toggleEmptyState();
    }

    function toggleEmptyState() {
      const tasks = getTasks();
      emptyState.style.display = tasks.length === 0 ? 'block' : 'none';
    }

    function renderTasks() {
      const tasks = getTasks();
      taskList.innerHTML = '';
      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = task.completed ? 'completed' : '';
        li.innerHTML = `
          <div class="task-left">
            <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask(${task.id})">
            <span class="task-text">${escapeHtml(task.text)}</span>
          </div>
          <button class="delete-btn" onclick="deleteTask(${task.id})">删除</button>
        `;
        taskList.appendChild(li);
      });
      toggleEmptyState();
    }

    function loadTasks() {
      renderTasks();
    }

    function saveAndRenderTask(newTask) {
      const tasks = getTasks();
      tasks.push(newTask);
      saveTasks(tasks);
      renderTasks();
    }

    function toggleTask(id) {
      const tasks = getTasks();
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTasks(tasks);
        renderTasks();
      }
    }

    function deleteTask(id) {
      let tasks = getTasks();
      tasks = tasks.filter(t => t.id !== id);
      saveTasks(tasks);
      renderTasks();
    }

    function escapeHtml(unsafe) {
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>

</body>
</html>
